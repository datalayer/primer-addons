name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # The themes' contrast and shape (LOOP T-03, T-15): a failure fails the build.
      - name: Test
        run: npm test

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-npm
          npm pack --pack-destination dist-npm
          tar -tzf dist-npm/*.tgz > files.txt
          grep -q '^package/lib/index.js$' files.txt
          grep -q '^package/lib/index.d.ts$' files.txt

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '22'
        with:
          name: npm
          path: dist-npm/*.tgz

  # The gallery (examples/gallery) built from the package's source: a page
  # that does not type-check or bundle fails CI (LOOP G-10). It installs its
  # own dependencies (its package.json, no lockfile) beside the package's.
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm --prefix examples/gallery install --no-audit --no-fund
          # One React, one Primer, one styled-components: the package's source
          # resolves them from the root's node_modules, and a second copy under
          # the gallery makes the type check compare two of each. The gallery's
          # copy of anything the root has is removed, so both resolve the same.
          cd examples/gallery/node_modules
          for package in * @*/*; do
            case "$package" in
              .bin|@datalayer/primer-addons) continue ;;
              @*/*) ;;
              @*) continue ;;
            esac
            if [ -e "../../../node_modules/$package" ]; then rm -rf "$package"; fi
          done
          find .bin -xtype l -delete

      - name: Build the gallery
        run: npm run gallery:build
